# ==========================================
# SERVER ENVIRONMENT & NETWORK SECURITY CONFIGS
# ==========================================
server.port=8443

# ==========================================
# ENHANCEMENT: FILE-BACKED H2 PERSISTENCE ENGINE
# ==========================================
# Enable the web-accessible visualization graphical panel dashboard
spring.h2.console.enabled=true
# Access endpoint directory path structure for inspecting active schemas
spring.h2.console.path=/h2-console

# CRITICAL FIX: Diverts data storage from volatile RAM memory to a permanent disk asset
spring.datasource.url=jdbc:h2:file:./data/ssl_audit_db;DB_CLOSE_DELAY=-1
# Declaring standard relational JDBC system driver definitions
spring.datasource.driverClassName=org.h2.Driver
# Default administrative configuration account identification key attributes
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# ENHANCEMENT: SPRING DATA HIBERNATE ORM INTERFACES
# ==========================================
# Explicitly selecting optimized H2 execution queries
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Controls schema creation lifecycle. Enforces update tracking over destructive clean drops
spring.jpa.hibernate.ddl-auto=update
# Verbose tracking instructing the engine to mirror SQL logs straight inside the running backend terminal
spring.jpa.show-sql=true
