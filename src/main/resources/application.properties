# ==========================================
# SERVER ENVIRONMENT & NETWORK SECURITY CONFIGS
# ==========================================
server.port=8443

# ==========================================
# FIXED: TRUE FILE-BACKED H2 PERSISTENCE ENGINE
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Diverts data transactions from volatile RAM memory to a permanent storage disk asset
spring.datasource.url=jdbc:h2:file:./data/ssl_audit_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# FIXED: PREVENT HIBERNATE FROM WIPING SCHEMAS ON REBOOT
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'none' ensures existing tables, columns, and logging rows are completely preserved on reboot
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ==========================================
# FIXED: EXTERNALIZED SECURITY KEY HANDLING (NON-HARDCODED)
# ==========================================
app.security.secret-key=CustomSecureSecretKeyForCrypto2026!
